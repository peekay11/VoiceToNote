AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  VoiceToNote - Zero idle cost serverless backend.
  Cognito, DynamoDB on-demand, S3, Transcribe, API Gateway HTTP API, Lambda ARM64.

  Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Architectures:
      - arm64
    Runtime: python3.12
    Environment:
      Variables:
        NOTES_TABLE: !Ref NotesTable
        AUDIO_BUCKET: !Ref AudioBucket
        TRANSCRIBE_REGION: af-south-1
        BEDROCK_MODEL_ID: amazon.nova-micro-v1:0

Resources:

  # ==========================================
  # Cognito User Pool
  # ==========================================
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-user-pool
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
          RequireUppercase: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ${AWS::StackName}-client
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # ==========================================
  # S3 Bucket - NO NotificationConfiguration here
  # (wired separately via custom resource to avoid circular dependency)
  # ==========================================
  AudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [PUT, GET, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAudioAfter7Days
            Status: Enabled
            ExpirationInDays: 7

  # Allows AWS Transcribe (running in us-east-1) to read audio files from this af-south-1 bucket
  AudioBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AudioBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: transcribe.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${AudioBucket.Arn}/*

  # ==========================================
  # DynamoDB Table (PAY_PER_REQUEST = $0 idle)
  # ==========================================
  NotesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-notes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: noteId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: noteId
          KeyType: RANGE

  # ==========================================
  # HTTP API Gateway with Cognito JWT Auth
  # ==========================================
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: [Authorization, Content-Type]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              audience: [!Ref UserPoolClient]
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}

  # ==========================================
  # Lambda: Presigned S3 Upload URL
  # ==========================================
  GetUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/
      Handler: get_upload_url.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub ${AudioBucket.Arn}/*
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /upload-url
            Method: post

  # ==========================================
  # Lambda: Start Transcribe on S3 upload
  # (No SAM S3 Event - triggered via S3 notification custom resource below)
  # ==========================================
  StartTranscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/
      Handler: start_transcription.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub ${AudioBucket.Arn}/*
            - Effect: Allow
              Action:
                - transcribe:StartTranscriptionJob
                - transcribe:TagResource
              Resource: '*'

  # Allow S3 to invoke StartTranscribeFunction
  StartTranscribeFunctionS3Permission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt StartTranscribeFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  # ==========================================
  # Custom Resource: Wire S3 -> Lambda notification
  # ==========================================
  S3NotificationSetupFunction:
    Type: AWS::Serverless::Function
    Properties:
      InlineCode: |
        import boto3, json, urllib.request

        def handler(event, context):
            s3 = boto3.client('s3')
            bucket = event['ResourceProperties']['BucketName']
            lambda_arn = event['ResourceProperties']['LambdaArn']
            status = 'SUCCESS'
            reason = ''
            try:
                if event['RequestType'] in ('Create', 'Update'):
                    s3.put_bucket_notification_configuration(
                        Bucket=bucket,
                        NotificationConfiguration={
                            'LambdaFunctionConfigurations': [{
                                'LambdaFunctionArn': lambda_arn,
                                'Events': ['s3:ObjectCreated:*'],
                                'Filter': {
                                    'Key': {
                                        'FilterRules': [
                                            {'Name': 'prefix', 'Value': 'audio/'}
                                        ]
                                    }
                                }
                            }]
                        }
                    )
                elif event['RequestType'] == 'Delete':
                    try:
                        s3.put_bucket_notification_configuration(
                            Bucket=bucket,
                            NotificationConfiguration={}
                        )
                    except Exception:
                        pass
            except Exception as e:
                status = 'FAILED'
                reason = str(e)

            body = json.dumps({
                'Status': status,
                'Reason': reason,
                'PhysicalResourceId': f"{bucket}-notification",
                'StackId': event['StackId'],
                'RequestId': event['RequestId'],
                'LogicalResourceId': event['LogicalResourceId'],
                'Data': {}
            }).encode()
            req = urllib.request.Request(
                event['ResponseURL'],
                data=body,
                headers={'Content-Type': ''},
                method='PUT'
            )
            urllib.request.urlopen(req)
      Handler: index.handler
      Runtime: python3.12
      Architectures: [arm64]
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutBucketNotification
                - s3:GetBucketNotification
              Resource: !GetAtt AudioBucket.Arn

  S3NotificationSetup:
    Type: AWS::CloudFormation::CustomResource
    DependsOn: StartTranscribeFunctionS3Permission
    Properties:
      ServiceToken: !GetAtt S3NotificationSetupFunction.Arn
      BucketName: !Ref AudioBucket
      LambdaArn: !GetAtt StartTranscribeFunction.Arn

  # ==========================================
  # Lambda: Process Transcript + Classify + Save
  # ==========================================
  ProcessTranscriptFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/
      Handler: process_transcript.lambda_handler
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub ${AudioBucket.Arn}/*
            - Effect: Allow
              Action: transcribe:GetTranscriptionJob
              Resource: '*'
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: '*'
        - DynamoDBCrudPolicy:
            TableName: !Ref NotesTable
      Events:
        TranscribeComplete:
          Type: CloudWatchEvent
          Properties:
            Pattern:
              source: [aws.transcribe]
              detail-type: [Transcribe Job State Change]
              detail:
                TranscriptionJobStatus: [COMPLETED]

  # ==========================================
  # Lambda: Notes CRUD API
  # ==========================================
  NotesApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/
      Handler: notes_api.lambda_handler
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NotesTable
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: '*'
      Events:
        ListNotes:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /notes
            Method: get
        GetNote:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /notes/{id}
            Method: get
        UpdateNote:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /notes/{id}
            Method: put
        DeleteNote:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /notes/{id}
            Method: delete

Outputs:
  ApiUrl:
    Description: HTTP API URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito App Client ID
    Value: !Ref UserPoolClient
  AudioBucketName:
    Description: S3 Audio Bucket
    Value: !Ref AudioBucket
