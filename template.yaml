AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  VoiceToNote Serverless Backend - Zero idle cost architecture ($0/mo when unused).
  Uses Cognito, DynamoDB (PAY_PER_REQUEST), S3, Transcribe, EventBridge, API Gateway HTTP API, and Lambda (ARM64).

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Architectures:
      - arm64
    Runtime: python3.12
    Environment:
      Variables:
        NOTES_TABLE: !Ref NotesTable
        AUDIO_BUCKET: !Ref AudioBucket

Resources:
  # ==========================================
  # Cognito User Pool (Free up to 50k MAUs)
  # ==========================================
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-user-pool
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
          RequireUppercase: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ${AWS::StackName}-client
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # ==========================================
  # S3 Bucket (With Lifecycle Rule for Audio)
  # ==========================================
  AudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-audio-${AWS::AccountId}
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [PUT, GET, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAudioRecordingsAfter7Days
            Status: Enabled
            ExpirationInDays: 7

  # ==========================================
  # DynamoDB Table (PAY_PER_REQUEST - $0 Idle)
  # ==========================================
  NotesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-notes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: noteId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: noteId
          KeyType: RANGE

  # ==========================================
  # HTTP API Gateway (Low cost + Native CORS)
  # ==========================================
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              audience:
                - !Ref UserPoolClient
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}

  # ==========================================
  # Lambda Functions
  # ==========================================
  GetUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/
      Handler: get_upload_url.lambda_handler
      Policies:
        - S3WritePolicy:
            BucketName: !Sub ${AWS::StackName}-audio-${AWS::AccountId}
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /upload-url
            Method: post

  StartTranscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/
      Handler: start_transcription.lambda_handler
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub ${AWS::StackName}-audio-${AWS::AccountId}
        - Statement:
            - Effect: Allow
              Action:
                - transcribe:StartTranscriptionJob
              Resource: '*'
      Events:
        AudioUploaded:
          Type: S3
          Properties:
            Bucket: !Ref AudioBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: audio/

  ProcessTranscriptFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/
      Handler: process_transcript.lambda_handler
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub ${AWS::StackName}-audio-${AWS::AccountId}
        - DynamoDBCrudPolicy:
            TableName: !Ref NotesTable
        - Statement:
            - Effect: Allow
              Action:
                - transcribe:GetTranscriptionJob
              Resource: '*'
      Events:
        TranscribeComplete:
          Type: CloudWatchEvent
          Properties:
            Pattern:
              source:
                - aws.transcribe
              detail-type:
                - Transcribe Job State Change
              detail:
                TranscriptionJobStatus:
                  - COMPLETED

  NotesApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/
      Handler: notes_api.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NotesTable
      Events:
        ListNotes:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /notes
            Method: get
        GetNote:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /notes/{id}
            Method: get
        UpdateNote:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /notes/{id}
            Method: put
        DeleteNote:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /notes/{id}
            Method: delete

Outputs:
  ApiUrl:
    Description: HTTP API endpoint URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito App Client ID
    Value: !Ref UserPoolClient
  AudioBucketName:
    Description: Audio S3 Bucket Name
    Value: !Ref AudioBucket
